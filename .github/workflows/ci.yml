name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Backend Tests (pytest)
  # ─────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: artifacts/api-server/python_server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artifacts/api-server/python_server/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
          --cov=main \
          --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/api-server/python_server/.coverage

  # ─────────────────────────────────────────────
  # Job 2: Frontend Typecheck & Build
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs

      - name: Typecheck frontend
        run: pnpm --filter @workspace/travel-web run typecheck

      - name: Build frontend
        run: pnpm --filter @workspace/travel-web run build
        env:
          BASE_URL: /
          PORT: 5173

  # ─────────────────────────────────────────────
  # Job 3: Lint
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        run: |
          ruff check \
          artifacts/api-server/python_server/main.py \
          --select E,F,W \
          --ignore E501